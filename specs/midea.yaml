# ===================================================================
# 美的集团（Midea）取数 Spec
# 纯 A股：深市主板 000333.SZ
# 特点：白电龙头，大盘蓝筹
# ===================================================================

meta:
  task_id: task9
  task_name: Midea
  created: 2026-07-12
  status: planned
  analyst: 大卫

target:
  name_cn: 美的集团
  name_en: Midea
  markets:
    - market: A股
      code: 000333.SZ
      tencent_code: sz000333
      exchange: 深交所
      board: 主板
      currency: CNY
      pct_limit: 10                # 主板 ±10%
  industry: 家电
  sector: 白色家电
  notes: 纯 A股，无港股；白电龙头，大盘蓝筹

# ── 数据源 ──
data_source:
  A股:
    provider: tencent_quote
    endpoint: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
    params:
      param: "sz000333,day,,,250,qfq"
    limit: 250
    notes: 免token；返回 data.sz000333.qfqday 数组
  港股: null

# ── 数据维度 ──
data_dimensions:
  - name: 日K线行情
    required: true
    fields: [trade_date, open, close, high, low, vol, amount, pct_chg, turnover]
    history_days: 250
    adjust: qfq
    scope: [A股]

# ── 字段映射 ──
field_mapping:
  A股_tencent:
    trade_date: "k[0].replace('-','')"
    open: "float(k[1])"
    close: "float(k[2])"
    high: "float(k[3])"
    low: "float(k[4])"
    vol: "float(k[5])"
    amount: "vol * (high+low+close)/3"
    pct_chg: "(close - prev_close) / prev_close * 100"
    turnover: null

# ── 输出 ──
output:
  formats: [csv, json]
  encoding: utf-8-sig
  path_pattern:
    csv: "data/midea_daily.csv"
    json: "data/midea_daily.json"
  sort: ascending_by_date
  date_format:
    A股: YYYYMMDD

# ── 质量校验 ──
quality_check:
  - rule: 字段完整性
    desc: trade_date/open/close/high/low/vol 非空
  - rule: 日期唯一
    desc: trade_date 不重复
  - rule: 价格合理性
    desc: low <= close <= high 且 low <= open <= high
  - rule: 涨跌幅阈值
    desc: "A股主板 |pct_chg| <= 10%"
    on_violation: warn
  - rule: 交易日连续性
    desc: 除节假日外无跳空
    on_violation: warn

# ── 交付物 ──
deliverables:
  - data/midea_daily.csv
  - data/midea_daily.json
  - outputs/midea_backtest_dashboard.html
  - README.md
