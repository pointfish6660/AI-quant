# ===================================================================
# 比亚迪（BYD）取数 Spec
# A+H 双重上市：深市主板 002594.SZ + 港股 01211.HK
# ===================================================================

meta:
  task_id: task5
  task_name: BYD
  created: 2026-07-01
  status: planned
  analyst: 大卫

target:
  name_cn: 比亚迪
  name_en: BYD
  markets:
    - market: A股
      code: 002594.SZ
      tencent_code: sz002594
      exchange: 深交所
      board: 主板                   # 2021年深市主板与中小板合并
      currency: CNY
      ipo_date: 2011-06-30
      pct_limit: 10                 # 主板 ±10%
    - market: 港股
      code: 01211.HK
      westock_code: hk01211
      exchange: 港交所
      board: 主板
      currency: HKD
      ipo_date: 2002-07-31
      pct_limit: null
  industry: 新能源汽车
  sector: 整车制造 + 动力电池
  notes: 港股上市更早（2002），A股 2011 回归；新能源车销量全球第一

# ── 数据源 ──
data_source:
  A股:
    provider: tencent_quote
    endpoint: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
    params:
      param: "sz002594,day,,,320,qfq"
    limit: 320
    notes: 免token；返回 data.sz002594.qfqday 数组
  港股:
    provider: westock_cli
    package: westock-data-clawhub@1.0.4
    command: kline hk01211 --period day --limit 300
    limit: 300
    notes: 输出 Markdown 表格，last 字段为收盘价

# ── 数据维度 ──
data_dimensions:
  - name: 日K线行情
    required: true
    fields: [trade_date, open, close, high, low, vol, amount, pct_chg, turnover]
    history_days: 300
    adjust: qfq
    scope: [A股, 港股]
  - name: 公司简况
    required: true
    fields: [公司全称, 行业, 上市日期, 总股本, 流通股本, 主营业务]
  - name: 财务指标
    required: false
    fields: [营收, 净利润, 毛利率, ROE, 资产负债率]
    periods: 8
  - name: A/H 折溢价跟踪
    required: true
    fields: [trade_date, a_close, hk_close, fx_usdhkd, ah_premium_pct]

# ── 字段映射 ──
field_mapping:
  A股_tencent:
    trade_date: "k[0].replace('-','')"
    open: "float(k[1])"
    close: "float(k[2])"
    high: "float(k[3])"
    low: "float(k[4])"
    vol: "float(k[5])"
    amount: "vol * (high+low+close)/3"
    pct_chg: "(close - prev_close) / prev_close * 100"
    turnover: null
  港股_westock:
    trade_date: "r['date']"
    open: "to_float(r['open'])"
    close: "to_float(r['last'])"
    high: "to_float(r['high'])"
    low: "to_float(r['low'])"
    vol: "to_float(r['volume'])"
    amount: "to_float(r['amount'])"
    pct_chg: "(close - prev_close) / prev_close * 100"
    turnover: "to_float(r['exchange'])"

# ── 输出 ──
output:
  formats: [csv, json]
  encoding: utf-8-sig
  path_pattern:
    csv_a: "data/byd_a_daily.csv"
    csv_hk: "data/byd_hk_daily.csv"
    json_a: "data/byd_a_daily.json"
    json_hk: "data/byd_hk_daily.json"
    profile: "data/byd_profile.json"
    ah_premium: "data/byd_ah_premium.csv"
  sort: ascending_by_date
  date_format:
    A股: YYYYMMDD
    港股: YYYY-MM-DD

# ── 质量校验 ──
quality_check:
  - rule: 字段完整性
    desc: trade_date/open/close/high/low/vol 非空
  - rule: 日期唯一
    desc: trade_date 不重复
  - rule: 价格合理性
    desc: low <= close <= high 且 low <= open <= high
  - rule: 涨跌幅阈值
    desc: "A股主板 |pct_chg| <= 10%；港股 |pct_chg| <= 30%"
    on_violation: warn
  - rule: A/H 折溢价合理性
    desc: A股 vs 港股收盘价折溢价率在 [-50%, +200%] 内
    on_violation: warn
  - rule: 交易日连续性
    desc: 除节假日外无跳空
    on_violation: warn

# ── 交付物 ──
deliverables:
  - data/byd_a_daily.csv
  - data/byd_hk_daily.csv
  - data/byd_a_daily.json
  - data/byd_hk_daily.json
  - data/byd_profile.json
  - data/byd_ah_premium.csv
  - outputs/byd_kline.html
  - outputs/byd_ah_premium.html
  - README.md
