# ===================================================================
# 长江电力（CYPC）取数 Spec
# 纯 A股：沪市主板 600900.SH
# 特点：水电蓝筹，长期分红标的
# ===================================================================

meta:
  task_id: task6
  task_name: CYPC
  created: 2026-07-01
  status: planned
  analyst: 大卫

target:
  name_cn: 长江电力
  name_en: CYPC
  markets:
    - market: A股
      code: 600900.SH
      tencent_code: sh600900
      exchange: 上交所
      board: 主板
      currency: CNY
      ipo_date: 2003-11-18
      pct_limit: 10                # 主板 ±10%
  industry: 电力
  sector: 水力发电
  notes: 纯 A股，无港股；大盘蓝筹，长期高分红标的，适合分红再投资策略

# ── 数据源 ──
data_source:
  A股:
    provider: tencent_quote
    endpoint: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
    params:
      param: "sh600900,day,,,320,qfq"
    limit: 320
    notes: 免token；返回 data.sh600900.qfqday 数组
  港股: null                       # 无港股
  补充:                              # 混合数据源模式
    - provider: tushare_mcp
      tool: mcp__tushareMcp__dividend
      params: { ts_code: "600900.SH" }
      purpose: 分红除权记录（除权日/每股分红/送转/股息率）
      output: data/cypc_dividend.csv
    - provider: tushare_mcp
      tool: mcp__tushareMcp__fx_daily
      params: { exchange: "USDCNH" }
      purpose: A/H 折溢价计算用汇率（task4/5 使用，task6 可选）
      output: null

# ── 数据维度 ──
data_dimensions:
  - name: 日K线行情
    required: true
    fields: [trade_date, open, close, high, low, vol, amount, pct_chg, turnover]
    history_days: 300
    adjust: qfq
    scope: [A股]
  - name: 公司简况
    required: true
    fields: [公司全称, 行业, 上市日期, 总股本, 流通股本, 主营业务]
  - name: 财务指标
    required: true                 # 分红标的，财务必看
    fields: [营收, 净利润, 毛利率, ROE, 资产负债率, 分红率, 股息率]
    periods: 8
  - name: 分红除权记录              # 分红标的必采
    required: true
    fields: [除权日, 每股分红, 分红率, 股息率]
    notes: 用于除权日价格跳空校验 + 长期分红收益可视化

# ── 字段映射 ──
field_mapping:
  A股_tencent:
    trade_date: "k[0].replace('-','')"
    open: "float(k[1])"
    close: "float(k[2])"
    high: "float(k[3])"
    low: "float(k[4])"
    vol: "float(k[5])"
    amount: "vol * (high+low+close)/3"
    pct_chg: "(close - prev_close) / prev_close * 100"
    turnover: null

# ── 输出 ──
output:
  formats: [csv, json]
  encoding: utf-8-sig
  path_pattern:
    csv: "data/cypc_daily.csv"
    json: "data/cypc_daily.json"
    profile: "data/cypc_profile.json"
    dividend: "data/cypc_dividend.csv"   # 分红记录
  sort: ascending_by_date
  date_format:
    A股: YYYYMMDD

# ── 质量校验 ──
quality_check:
  - rule: 字段完整性
    desc: trade_date/open/close/high/low/vol 非空
  - rule: 日期唯一
    desc: trade_date 不重复
  - rule: 价格合理性
    desc: low <= close <= high 且 low <= open <= high
  - rule: 涨跌幅阈值
    desc: "A股主板 |pct_chg| <= 10%"
    on_violation: warn
  - rule: 除权日跳空校验            # 分红标的特有
    desc: 除权日当天 pct_chg 显著为负（除权除息效应），需与分红记录匹配；若跳空超过 -5% 但无分红记录，告警
    on_violation: warn
  - rule: 交易日连续性
    desc: 除节假日外无跳空
    on_violation: warn

# ── 交付物 ──
deliverables:
  - data/cypc_daily.csv
  - data/cypc_daily.json
  - data/cypc_profile.json
  - data/cypc_dividend.csv
  - outputs/cypc_kline.html
  - outputs/cypc_dividend_history.html   # 分红历史 + 股息率可视化
  - README.md
